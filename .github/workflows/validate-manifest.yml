name: Validate manifest

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".claude-plugin/**"
      - "CHANGELOG.md"
      - ".github/workflows/validate-manifest.yml"
  push:
    branches: [main]
    paths:
      - ".claude-plugin/**"
      - "CHANGELOG.md"

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin.json
        run: |
          python3 <<'PY'
          import json, re, sys, pathlib

          errors = []

          plugin_path = pathlib.Path(".claude-plugin/plugin.json")

          try:
              plugin = json.loads(plugin_path.read_text(encoding="utf-8"))
          except json.JSONDecodeError as exc:
              print(f"::error::plugin.json inválido — {exc}")
              sys.exit(1)

          required = ["name", "version", "description", "author"]
          for field in required:
              if field not in plugin:
                  errors.append(f"plugin.json: campo obrigatório ausente: '{field}'")

          if plugin.get("name") != "hormozi-gtm":
              errors.append(f"plugin.json: name deve ser 'hormozi-gtm', encontrado '{plugin.get('name')}'")

          if not re.match(r"^\d+\.\d+\.\d+$", plugin.get("version", "")):
              errors.append(f"plugin.json: version deve seguir SemVer X.Y.Z, encontrado '{plugin.get('version')}'")

          version = plugin.get("version", "")
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          if version and f"## [{version}]" not in changelog:
              errors.append(f"CHANGELOG.md: seção [{version}] ausente — adicione antes do release")

          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)
          print("✓ plugin.json e CHANGELOG.md OK")
          PY
