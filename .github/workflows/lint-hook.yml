name: Lint hooks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "hooks/**"
      - ".github/workflows/lint-hook.yml"
  push:
    branches: [main]
    paths:
      - "hooks/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate hooks/*.json
        run: |
          python3 <<'PY'
          import json, pathlib, sys

          # Tipos válidos por evento (doc: code.claude.com/docs/en/hooks)
          # PostToolUse, PreToolUse aceitam mais tipos; SessionStart é restrito a command+mcp_tool
          BASE_TYPES = {"command", "mcp_tool", "http", "prompt", "agent"}
          ALLOWED_TYPES = {
              "SessionStart": {"command", "mcp_tool"},
              "PreToolUse": BASE_TYPES,
              "PostToolUse": BASE_TYPES,
              "UserPromptSubmit": BASE_TYPES,
              "Notification": BASE_TYPES,
              "Stop": BASE_TYPES,
              "SubagentStop": BASE_TYPES,
          }

          errors = []
          for hook_file in pathlib.Path("hooks").glob("*.json"):
              try:
                  data = json.loads(hook_file.read_text(encoding="utf-8"))
              except json.JSONDecodeError as exc:
                  errors.append(f"{hook_file}: JSON inválido — {exc}")
                  continue
              if not isinstance(data, dict):
                  errors.append(f"{hook_file}: deve ser objeto JSON")
                  continue
              for event, matchers in data.items():
                  if event not in ALLOWED_TYPES:
                      errors.append(f"{hook_file}: evento '{event}' não reconhecido")
                      continue
                  if not isinstance(matchers, list):
                      errors.append(f"{hook_file}.{event}: deve ser lista de matchers")
                      continue
                  for i, m in enumerate(matchers):
                      for j, h in enumerate(m.get("hooks", [])):
                          t = h.get("type")
                          if t not in ALLOWED_TYPES[event]:
                              errors.append(
                                  f"{hook_file}.{event}[{i}].hooks[{j}]: type '{t}' inválido para {event}. "
                                  f"Permitidos: {sorted(ALLOWED_TYPES[event])}"
                              )

          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)
          print("✓ hooks/*.json OK")
          PY
