name: Lint hooks

on:
  pull_request:
    paths:
      - "hooks/**"
      - ".github/workflows/lint-hook.yml"
  push:
    branches: [main]
    paths:
      - "hooks/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate hooks/*.json
        run: |
          python3 <<'PY'
          import json, pathlib, sys

          errors = []
          for hook in pathlib.Path("hooks").glob("*.json"):
              try:
                  data = json.loads(hook.read_text(encoding="utf-8"))
              except json.JSONDecodeError as exc:
                  errors.append(f"{hook}: JSON inválido — {exc}")
                  continue
              if not isinstance(data, dict):
                  errors.append(f"{hook}: deve ser objeto JSON")
                  continue

          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)
          print("✓ hooks/*.json OK")
          PY
